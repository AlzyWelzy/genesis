# Alembic configuration.
#
# The database URL is deliberately absent: it is injected by `migrations/env.py`
# from `app.core.config.settings`, so migrations and the application can never
# be pointed at different databases.

[alembic]
script_location = migrations

# Put the project root on sys.path so `env.py` can import the application.
# Without it, `alembic` run from the project root cannot find `app`, because
# Alembic loads env.py by file path rather than as a package module.
prepend_sys_path = .

# Split `prepend_sys_path` on the OS path separator. Without this Alembic
# falls back to legacy splitting on spaces, commas AND colons, which mangles
# any path containing one — and warns about it on every invocation.
path_separator = os

# Prefix revision files with a UTC timestamp so `ls` shows true chronological
# order. Without it, filenames are random hashes and history is unreadable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Keep generated migrations formatted and lint-clean.
[post_write_hooks]
hooks = ruff_format ruff_fix
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = uv
ruff_fix.options = run ruff check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
