{#
  Shared chrome for every HTML email.

  Inline styles only: mail clients strip <style> blocks and never fetch external
  stylesheets, so anything not inlined is simply not applied. Table-based layout
  for the same reason — Outlook's rendering engine is Word, which does not
  support modern CSS layout.

  Concrete templates extend this and fill the `content` block.
#}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ subject }}{% endblock %}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; color:#1a1a1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5; padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:8px; padding:32px;">
            <tr>
              <td style="padding-bottom:24px; font-size:18px; font-weight:600;">
                {{ app_name }}
              </td>
            </tr>
            <tr>
              <td style="font-size:15px; line-height:1.6;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding-top:32px; border-top:1px solid #e5e5e5; margin-top:24px; font-size:12px; color:#767676; line-height:1.5;">
                {% block footer %}
                  You are receiving this because of activity on your {{ app_name }} account.
                {% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
