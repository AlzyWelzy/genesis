[project]
name = "genesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
# Observability backends are optional so a deployment that does not use them
# does not carry their dependency trees. Both degrade to no-ops when absent —
# an observability dependency must never be why the app refuses to start.
metrics = ["prometheus-client>=0.21"]
tracing = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
# The rule set is deliberately strict. A lint rule is a code review comment that
# never forgets, never gets tired and costs nothing to enforce; each one below
# replaces a class of comment we would otherwise write by hand forever.

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — real bugs: unused and undefined names
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort — deterministic import order
    "N",      # pep8-naming
    "D",      # pydocstyle — every public symbol documented
    "UP",     # pyupgrade — modern syntax for the target version
    "ANN",    # flake8-annotations — no untyped defs
    "ASYNC",  # blocking calls inside async functions
    "S",      # bandit — security anti-patterns
    "BLE",    # blind except
    "B",      # bugbear — mutable defaults, misuse of builtins
    "A",      # builtin shadowing
    "C4",     # comprehension simplification
    "DTZ",    # naive datetimes — the most common date bug there is
    "T20",    # no print() in application code
    "G",      # logging call correctness (no f-strings in log messages)
    "ICN",    # conventional import aliases
    "PIE",    # misc lints
    "PT",     # pytest style
    "Q",      # quote consistency
    "RSE",    # raise statement style
    "RET",    # return statement simplification
    "SIM",    # simplification
    "SLF",    # private member access across objects
    "TID",    # tidy imports — bans relative imports
    "ARG",    # unused arguments
    "PTH",    # prefer pathlib over os.path
    "ERA",    # commented-out code
    "PL",     # pylint subset
    "TRY",    # exception anti-patterns
    "PERF",   # obvious performance traps
    "RUF",    # ruff-specific
]
ignore = [
    "D203",    # conflicts with D211; we use "no blank line before class docstring"
    "D213",    # conflicts with D212; we use "summary on the first line"
    "D107",    # __init__ docstring — Google style documents args on the class
    "ANN401",  # Any is legitimate in generic plumbing (payloads, **kwargs)
    "TRY003",  # long messages outside the exception class — ours are contextual
    "EM101",   # string literal in raise — noise for one-off internal errors
    "EM102",
    "ISC001",  # conflicts with the formatter
    "COM812",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests are held to different standards than application code, deliberately:
#   S101/S105/S106  asserts and fake credentials are the point
#   D1xx            a well-named test IS its documentation; a docstring is
#                   added only when the *why* is non-obvious
#   PLR2004         magic numbers are the expected values
#   PLR0913/0917    parametrised tests take one argument per case column
#   PLC0415         local imports isolate a module under test or avoid cycles
#   SLF001          patching a private seam is legitimate in a fixture
#   ARG001/ARG002   fixtures are requested by name and often unused in the body
#   ANN001/ANN201   a fixture's type is the object it yields; spelling it out
#                   adds imports and noise without catching anything
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
    "D100",
    "D101",
    "D102",
    "D103",
    "PLR2004",
    "PLR0913",
    "PLR0917",
    "PLC0415",
    "SLF001",
    "ARG001",
    "ARG002",
    "ANN001",
    "ANN201",
    "ANN202",
]
# SQLAlchemy's TypeDecorator contract fixes both the signature and the
# parameter *names* of process_bind_param / process_result_value. `dialect` is
# unused by these decorators but cannot be renamed or dropped: doing either
# breaks the override, which ty correctly rejects.
"app/infrastructure/database/types.py" = ["ARG002"]
# Observability backends are optional extras. Importing them at module level
# would crash any deployment that has not installed them, which is the exact
# outcome the optional-extra design exists to prevent — so the imports are
# deliberately inside the functions that need them.
"app/infrastructure/observability/*.py" = ["PLC0415"]
# Alembic owns these files' structure; its templates are not ours to restyle.
"migrations/**/*.py" = ["D", "ANN", "ERA", "INP001"]
# Scripts are CLIs — printing is their interface.
"scripts/**/*.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Relative imports make a file's dependencies unreadable and break on a move.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# -ra reports why tests were skipped or xfailed; --strict-markers turns a
# mistyped marker into an error instead of a silently unfiltered test.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: pure logic, no I/O (the default)",
    "integration: requires a real database or Redis",
    "slow: takes more than a second",
]
filterwarnings = [
    # A DeprecationWarning is a scheduled outage. Fail on it now, while the fix
    # is cheap, rather than on the release that removes the API.
    "error::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

# ---------------------------------------------------------------------------
# ty — type checking
# ---------------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["app", "tests", "scripts", "migrations"]

[tool.ty.rules]
# Unused suppressions rot: they hide the fact that the issue is already gone.
unused-ignore-comment = "error"
